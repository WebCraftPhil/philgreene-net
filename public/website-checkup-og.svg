<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Free Website Lead Checkup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5" />
      <stop offset="1" stop-color="#f8f3ee" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102a2c" />
      <stop offset="1" stop-color="#0b1a1d" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="0" y="0" width="1200" height="18" fill="#f0642f" />

  <g transform="translate(72 72)">
    <rect x="0" y="0" width="250" height="46" rx="23" fill="#102a2c" />
    <text x="24" y="31" font-family="Manrope,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">WEBSITE CHECKUP</text>
  </g>

  <text x="72" y="190" font-family="Manrope,Arial,sans-serif" font-size="76" font-weight="800" fill="#102a2c">Find where leads</text>
  <text x="72" y="272" font-family="Manrope,Arial,sans-serif" font-size="76" font-weight="800" fill="#102a2c">are getting lost</text>
  <text x="72" y="338" font-family="Manrope,Arial,sans-serif" font-size="28" font-weight="500" fill="#496064">Free review for local service businesses: calls, quote requests, trust, and mobile usability.</text>

